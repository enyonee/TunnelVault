# Lima VM for tunnelvault e2e testing
# Usage: limactl create --name tv-test scripts/lima.yaml

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

cpus: 2
memory: "2GiB"
disk: "10GiB"

mounts:
  - location: "~"
    writable: false
  # Project dir writable for test artifacts
  - location: "/tmp/tv-test"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive

      # Docker
      if ! command -v docker &>/dev/null; then
        curl -fsSL https://get.docker.com | sh
        # Add all non-root human users to docker group
        for u in $(getent passwd | awk -F: '$3 >= 1000 && $3 < 65534 {print $1}'); do
          usermod -aG docker "$u"
        done
      fi

      # Docker Compose plugin
      if ! docker compose version &>/dev/null; then
        apt-get install -y docker-compose-plugin
      fi

      # Python + uv
      apt-get update -qq
      apt-get install -y python3 python3-venv curl
      if ! command -v uv &>/dev/null; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
      fi

      # TUN device
      mkdir -p /dev/net
      [ -c /dev/net/tun ] || mknod /dev/net/tun c 10 200
      chmod 666 /dev/net/tun

      # VPN tools
      apt-get install -y openconnect openvpn wireguard-tools iputils-ping iproute2 tcpdump

      # sing-box binary
      if ! command -v sing-box &>/dev/null; then
        ARCH=$(uname -m | sed 's/aarch64/arm64/;s/x86_64/amd64/')
        curl -Lo /tmp/sing-box.tar.gz \
          "https://github.com/SagerNet/sing-box/releases/download/v1.11.0/sing-box-1.11.0-linux-${ARCH}.tar.gz"
        tar -xzf /tmp/sing-box.tar.gz -C /tmp
        mv /tmp/sing-box-*/sing-box /usr/local/bin/
        rm -rf /tmp/sing-box*
      fi
