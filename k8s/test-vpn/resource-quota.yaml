# Лимиты ресурсов для test-vpn namespace
# Не даём тестам сожрать prod ресурсы
apiVersion: v1
kind: ResourceQuota
metadata:
  name: test-vpn-quota
  namespace: test-vpn
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    persistentvolumeclaims: "0"
---
# LimitRange для дефолтных лимитов (если pod не указал)
apiVersion: v1
kind: LimitRange
metadata:
  name: test-vpn-limits
  namespace: test-vpn
spec:
  limits:
  - default:
      cpu: 200m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    type: Container
