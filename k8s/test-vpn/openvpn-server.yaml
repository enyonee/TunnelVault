apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvpn-server
  namespace: test-vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openvpn-server
  template:
    metadata:
      labels:
        app: openvpn-server
    spec:
      containers:
      - name: openvpn
        image: ghcr.io/enyonee/tunnelvault-openvpn-server:latest
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        ports:
        - containerPort: 1194
          protocol: UDP
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: openvpn-server
  namespace: test-vpn
spec:
  selector:
    app: openvpn-server
  ports:
  - port: 1194
    targetPort: 1194
    protocol: UDP
