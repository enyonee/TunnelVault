apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocserv
  namespace: test-vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocserv
  template:
    metadata:
      labels:
        app: ocserv
    spec:
      containers:
      - name: ocserv
        image: ghcr.io/enyonee/tunnelvault-ocserv:latest
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        ports:
        - containerPort: 4443
          protocol: TCP
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: ocserv
  namespace: test-vpn
spec:
  selector:
    app: ocserv
  ports:
  - port: 4443
    targetPort: 4443
    protocol: TCP
