services:
  openvpn-server:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.openvpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "pgrep", "openvpn"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.10

  ocserv:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.ocserv
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4443"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.11

  singbox-server:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.singbox-server
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8388"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.12

  test-runner:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.test-runner
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - OPENVPN_SERVER=openvpn-server
      - OCSERV_HOST=ocserv
      - OCSERV_PORT=4443
      - OCSERV_USER=testuser
      - OCSERV_PASS=testpass
      - SINGBOX_SERVER=singbox-server
      - SINGBOX_SS_PORT=8388
      - SINGBOX_SS_PASSWORD=test-password-12345
      - TUN_AVAILABLE=${TUN_AVAILABLE:-0}
    depends_on:
      openvpn-server:
        condition: service_healthy
      ocserv:
        condition: service_healthy
      singbox-server:
        condition: service_healthy
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.20

networks:
  vpn-e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
