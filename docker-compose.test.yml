services:
  openvpn-server:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.openvpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "pgrep", "openvpn"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.10

  ocserv:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.ocserv
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4443"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.11

  singbox-server:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.singbox-server
    ports:
      - "18388:8388"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8388"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.12

  wireguard-server:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.wireguard-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - wg-shared:/shared
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.14

  fake-fortinet:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.fake-fortinet
    ports:
      - "14443:4443"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,ssl; urllib.request.urlopen('https://127.0.0.1:4443/remote/login', context=ssl._create_unverified_context())"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.13

  ssh-server:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.ssh-server
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.15

  strongswan-server:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.strongswan-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ipsec-shared:/shared
    healthcheck:
      test: ["CMD", "swanctl", "--stats"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.16

  test-runner:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.test-runner
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - wg-shared:/shared/wg
      - ipsec-shared:/shared/ipsec
    environment:
      - OPENVPN_SERVER=openvpn-server
      - OCSERV_HOST=ocserv
      - OCSERV_PORT=4443
      - OCSERV_USER=testuser
      - OCSERV_PASS=testpass
      - SINGBOX_SERVER=singbox-server
      - SINGBOX_SS_PORT=8388
      - SINGBOX_SS_PASSWORD=test-password-12345
      - FORTINET_HOST=fake-fortinet
      - FORTINET_PORT=4443
      - FORTINET_USER=testuser
      - FORTINET_PASS=testpass
      - WIREGUARD_SERVER=wireguard-server
      - WIREGUARD_PORT=51820
      - SSH_SERVER=ssh-server
      - SSH_PORT=22
      - SSH_USER=testuser
      - SSH_PASS=testpass
      - IPSEC_SERVER=strongswan-server
      - IPSEC_PSK=test-psk-secret-12345
      - TUN_AVAILABLE=${TUN_AVAILABLE:-0}
    depends_on:
      openvpn-server:
        condition: service_healthy
      ocserv:
        condition: service_healthy
      singbox-server:
        condition: service_healthy
      fake-fortinet:
        condition: service_healthy
      wireguard-server:
        condition: service_healthy
      ssh-server:
        condition: service_healthy
      strongswan-server:
        condition: service_healthy
    networks:
      vpn-e2e:
        ipv4_address: 172.28.0.20

volumes:
  wg-shared:
  ipsec-shared:

networks:
  vpn-e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
