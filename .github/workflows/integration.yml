name: Integration Tests (K8s)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  k8s-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NS: test-vpn-${{ github.run_id }}
      SSH: ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VDS_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Build and push images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          TAG=${{ github.run_id }}

          docker build -t ghcr.io/enyonee/tunnelvault-openvpn-server:$TAG \
            -f k8s/test-vpn/Dockerfile.openvpn-server .
          docker build -t ghcr.io/enyonee/tunnelvault-ocserv:$TAG \
            -f k8s/test-vpn/Dockerfile.ocserv .
          docker build -t ghcr.io/enyonee/tunnelvault-test:$TAG \
            -f k8s/test-vpn/Dockerfile.test-runner .

          docker push ghcr.io/enyonee/tunnelvault-openvpn-server:$TAG
          docker push ghcr.io/enyonee/tunnelvault-ocserv:$TAG
          docker push ghcr.io/enyonee/tunnelvault-test:$TAG

      - name: Create ephemeral namespace
        run: |
          $SSH "sudo kubectl create namespace $NS && \
                sudo kubectl label namespace $NS env=test app=tunnelvault"

      - name: Apply NetworkPolicy + ResourceQuota
        run: |
          for f in k8s/test-vpn/network-policy.yaml k8s/test-vpn/resource-quota.yaml; do
            sed "s/namespace: test-vpn/namespace: $NS/g" "$f" | \
              $SSH "sudo kubectl apply -f -"
          done

      - name: Create GHCR pull secret
        run: |
          $SSH "sudo kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            -n $NS"

      - name: Create client configs
        run: |
          # OpenVPN client config with correct namespace
          sed "s/NS_PLACEHOLDER/$NS/g" k8s/test-vpn/pki/client.ovpn > /tmp/client.ovpn

          # ocserv fingerprint
          FINGERPRINT=$(cat k8s/test-vpn/pki/ocserv-fingerprint.txt)

          $SSH "sudo kubectl create configmap vpn-client-configs -n $NS \
            --from-literal=client.ovpn='$(cat /tmp/client.ovpn)' \
            --from-literal=ocserv-fingerprint='$FINGERPRINT'"

      - name: Deploy VPN servers
        run: |
          TAG=${{ github.run_id }}
          for f in k8s/test-vpn/openvpn-server.yaml k8s/test-vpn/ocserv.yaml k8s/test-vpn/singbox-server.yaml; do
            sed "s/namespace: test-vpn/namespace: $NS/g; s/\.test-vpn/.$NS/g; s|:latest|:$TAG|g" "$f" | \
              $SSH "sudo kubectl apply -f -"
          done
          # Patch imagePullSecrets
          for deploy in openvpn-server ocserv; do
            $SSH "sudo kubectl patch deploy $deploy -n $NS -p '{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"ghcr-pull\"}]}}}}'"
          done

      - name: Wait for VPN servers
        run: |
          for i in $(seq 1 40); do
            READY=$($SSH "sudo kubectl get deploy -n $NS -o jsonpath='{range .items[*]}{.metadata.name}={.status.availableReplicas}{\" \"}{end}'" || echo "")
            echo "Deploy status: $READY"
            if echo "$READY" | grep -q "openvpn-server=1" && echo "$READY" | grep -q "singbox-server=1"; then
              echo "VPN servers ready"
              break
            fi
            sleep 10
          done

      - name: Run test Job
        run: |
          TAG=${{ github.run_id }}
          sed -e "s/namespace: test-vpn/namespace: $NS/g" \
              -e "s/\.test-vpn/.$NS/g" \
              -e "s|ghcr.io/enyonee/tunnelvault-test:latest|ghcr.io/enyonee/tunnelvault-test:$TAG|g" \
              k8s/test-vpn/test-runner-job.yaml | \
            $SSH "sudo kubectl apply -f -"

      - name: Wait for test completion
        run: |
          for i in $(seq 1 60); do
            STATUS=$($SSH "sudo kubectl get job tunnelvault-integration-test -n $NS -o jsonpath='{.status.conditions[0].type}' 2>/dev/null" || echo "")
            if [ "$STATUS" = "Complete" ] || [ "$STATUS" = "Failed" ]; then
              echo "Job finished: $STATUS"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 15
          done

      - name: Collect logs
        id: test-results
        if: always()
        run: |
          $SSH "sudo kubectl logs -n $NS job/tunnelvault-integration-test 2>&1" || echo "Failed to get logs"

          EXIT=$($SSH "sudo kubectl get pod -n $NS -l job-name=tunnelvault-integration-test \
            -o jsonpath='{.items[0].status.containerStatuses[0].state.terminated.exitCode}' 2>/dev/null" || echo "1")

          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          [ "$EXIT" = "0" ]

      - name: Cleanup namespace
        if: always()
        run: |
          $SSH "sudo kubectl delete namespace $NS --wait=false 2>/dev/null || true"

      - name: Notify Telegram
        if: always()
        uses: enyonee/telegram-notify-action@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ steps.test-results.outcome }}
          message: |
            <b>TunnelVault</b> integration tests

            Branch: <code>${{ inputs.branch }}</code>
            Status: ${{ steps.test-results.outcome == 'success' && 'PASSED' || 'FAILED' }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs</a>
