name: Integration Tests (K8s)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: true
        default: "main"

jobs:
  k8s-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NS: test-vpn-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VDS_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Create ephemeral namespace
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }} \
            "sudo kubectl create namespace $NS && \
             sudo kubectl label namespace $NS env=test app=tunnelvault"

      - name: Apply NetworkPolicy + ResourceQuota
        run: |
          for f in k8s/test-vpn/network-policy.yaml k8s/test-vpn/resource-quota.yaml; do
            sed "s/namespace: test-vpn/namespace: $NS/g" "$f" | \
              ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }} "sudo kubectl apply -f -"
          done

      - name: Deploy VPN servers
        run: |
          for f in k8s/test-vpn/openvpn-server.yaml k8s/test-vpn/ocserv.yaml k8s/test-vpn/singbox-server.yaml; do
            sed "s/namespace: test-vpn/namespace: $NS/g; s/\.test-vpn/.$NS/g" "$f" | \
              ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }} "sudo kubectl apply -f -"
          done

      - name: Wait for VPN servers
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }} \
            "sudo kubectl wait --for=condition=Available deploy --all -n $NS --timeout=120s || true; sleep 5"

      - name: Build and push test runner
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/enyonee/tunnelvault-test:${{ github.run_id }} \
            -f k8s/test-vpn/Dockerfile.test-runner .
          docker push ghcr.io/enyonee/tunnelvault-test:${{ github.run_id }}

      - name: Run test Job
        run: |
          sed -e "s/namespace: test-vpn/namespace: $NS/g" \
              -e "s/\.test-vpn/.$NS/g" \
              -e "s|ghcr.io/enyonee/tunnelvault-test:latest|ghcr.io/enyonee/tunnelvault-test:${{ github.run_id }}|g" \
              k8s/test-vpn/test-runner-job.yaml | \
            ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }} "sudo kubectl apply -f -"

      - name: Wait and collect logs
        id: test-results
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }} \
            "sudo kubectl wait --for=condition=Complete job/tunnelvault-integration-test -n $NS --timeout=300s 2>/dev/null || \
             sudo kubectl wait --for=condition=Failed job/tunnelvault-integration-test -n $NS --timeout=300s 2>/dev/null || true"

          LOGS=$(ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }} \
            "sudo kubectl logs -n $NS job/tunnelvault-integration-test 2>&1" || echo "Failed to get logs")
          echo "$LOGS"

          EXIT=$(ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }} \
            "sudo kubectl get pod -n $NS -l job-name=tunnelvault-integration-test \
             -o jsonpath='{.items[0].status.containerStatuses[0].state.terminated.exitCode}' 2>/dev/null" || echo "1")

          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          [ "$EXIT" = "0" ]

      - name: Cleanup namespace
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VDS_HOST }} \
            "sudo kubectl delete namespace $NS --wait=false 2>/dev/null || true"

      - name: Cleanup test image
        if: always()
        run: |
          docker rmi ghcr.io/enyonee/tunnelvault-test:${{ github.run_id }} 2>/dev/null || true

      - name: Notify Telegram
        if: always()
        uses: enyonee/telegram-notify-action@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ steps.test-results.outcome }}
          message: |
            <b>TunnelVault</b> integration tests

            Branch: <code>${{ inputs.branch }}</code>
            Status: ${{ steps.test-results.outcome == 'success' && 'PASSED' || 'FAILED' }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs</a>
