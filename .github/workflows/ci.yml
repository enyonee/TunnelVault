name: CI

on:
  push:
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: enyonee/.github/.github/workflows/python-ci.yml@v1
    with:
      project: TunnelVault
      uv-sync-args: "--group dev"
      test-command: 'uv run pytest tests/ -x -q -o "addopts=" -m "not network" --ignore=tests/integration/k8s'
      os-matrix: '["ubuntu-latest", "windows-latest", "macos-latest"]'
    secrets: inherit

  notify-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline "$PREV_TAG".."${{ github.ref_name }}" | grep -v 'bump version' | head -15)
          else
            LOG=$(git log --oneline -10 "${{ github.ref_name }}" | head -15)
          fi
          {
            echo 'log<<EOF'
            echo "$LOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram - release
        uses: enyonee/telegram-notify-action@v2
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          project: TunnelVault
          version: ${{ github.ref_name }}
          event: Release
          branch: ${{ github.ref_name }}
          changelog: ${{ steps.changelog.outputs.log }}
