name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: enyonee/.github/.github/workflows/python-ci.yml@v1
    with:
      project: TunnelVault
      uv-sync-args: "--group dev"
      test-command: 'uv run pytest tests/ -x -q -o "addopts=" -m "not network"'
      os-matrix: '["ubuntu-latest", "windows-latest", "macos-latest"]'
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Build package
        run: |
          uv build

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline "$PREV_TAG".."${{ github.ref_name }}" | grep -v 'bump version' | head -15)
          else
            LOG=$(git log --oneline -10 "${{ github.ref_name }}" | head -15)
          fi
          {
            echo 'log<<EOF'
            echo "$LOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.changelog.outputs.log }}" \
            dist/*

      - name: Publish to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload dist/*

      - name: Notify Telegram
        if: always()
        uses: enyonee/telegram-notify-action@v2
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ job.status }}
          project: TunnelVault
          version: ${{ github.ref_name }}
          event: Release
          branch: ${{ github.ref_name }}
          changelog: ${{ steps.changelog.outputs.log }}
