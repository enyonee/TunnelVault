name: CI

on:
  push:
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -x -q -n auto -m "not network" --ignore=tests/integration/k8s

      - name: Notify Telegram - CI failed
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: enyonee/telegram-notify-action@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          message: |
            CI failed on <b>${{ matrix.os }}</b>

            Branch: <code>${{ github.head_ref || github.ref_name }}</code>
            Commit: <code>${{ github.sha }}</code>
            Author: ${{ github.actor }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs</a>

  # Integration tests: separate workflow (integration.yml)
  # Trigger: gh workflow run integration.yml -f branch=<branch>

  notify-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline "$PREV_TAG".."${{ github.ref_name }}" | grep -v 'bump version' | head -15)
          else
            LOG=$(git log --oneline -10 "${{ github.ref_name }}" | head -15)
          fi
          {
            echo 'log<<EOF'
            echo "$LOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram - release
        uses: enyonee/telegram-notify-action@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          message: |
            <b>TunnelVault</b> <code>${{ github.ref_name }}</code>

            <b>Changes:</b>
            <code>${{ steps.changelog.outputs.log }}</code>

            <a href="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}">Release</a>
