name: CI

on:
  push:
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -x -q -n auto -m "not network" --ignore=tests/integration/k8s

      - name: Notify Telegram - CI failed
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: enyonee/telegram-notify-action@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          message: |
            CI failed on <b>${{ matrix.os }}</b>

            Branch: <code>${{ github.head_ref || github.ref_name }}</code>
            Commit: <code>${{ github.sha }}</code>
            Author: ${{ github.actor }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs</a>

  integration-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      openvpn-server:
        image: kylemanna/openvpn:latest
        ports:
          - 1194:1194/udp
        options: --cap-add=NET_ADMIN
      singbox-server:
        image: ghcr.io/sagernet/sing-box:latest
        ports:
          - 8388:8388
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install VPN clients
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn openfortivpn iproute2 iputils-ping netcat-openbsd

      - run: uv sync --extra dev

      - name: Run integration tests (Linux only)
        env:
          OPENVPN_SERVER: localhost
          SINGBOX_SERVER: localhost
          SINGBOX_SS_PORT: "8388"
          SINGBOX_SS_PASSWORD: "test-password-12345"
        run: |
          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          uv run pytest tests/integration/k8s/test_singbox.py tests/integration/k8s/test_health_checks.py -x -v --tb=short -m network || true

  notify-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline "$PREV_TAG".."${{ github.ref_name }}" | grep -v 'bump version' | head -15)
          else
            LOG=$(git log --oneline -10 "${{ github.ref_name }}" | head -15)
          fi
          {
            echo 'log<<EOF'
            echo "$LOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram - release
        uses: enyonee/telegram-notify-action@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          message: |
            <b>TunnelVault</b> <code>${{ github.ref_name }}</code>

            <b>Changes:</b>
            <code>${{ steps.changelog.outputs.log }}</code>

            <a href="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}">Release</a>
