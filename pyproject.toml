[project]
name = "tunnelvault"
version = "1.4.0"
requires-python = ">=3.10"
dependencies = [
    "dnslib>=0.9",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n auto"
markers = [
    "network: tests that require network access (real openssl, DNS)",
    "k8s: tests that require K8s test-vpn infrastructure (VPN servers)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.4",
]
